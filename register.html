
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — 12 ёлочных игрушек до Нового года</title>
  <link rel="icon" type="image/png" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">АВАТАРСКИЙ KLIPTOK<span>★</span></a>
  <nav>
    <a href="index.html">Главная</a>
    <a href="rules.html">Правила</a>
  </nav>
</header>

<main class="page narrow">
  <section class="panel">
    <div class="eyebrow">PLAYER ACCESS</div>
    <h1>ВХОД В АККАУНТ</h1>
    <p class="lead">Введи VK ID и пароль, выданный организаторами.</p>

    <form id="register-form">
      <label for="vk-id">ID из TGC</label>
      <input
        id="vk-id"
        name="vk-id"
        placeholder="Например, 123456789"
        required
        maxlength="80"
      >

      <label for="vk-password">Пароль участника</label>
      <input
        id="vk-password"
        name="vk-password"
        type="password"
        placeholder="Твой индивидуальный пароль"
        required
        autocomplete="current-password"
        maxlength="120"
      >

      <p class="hint">
        ID и пароль должны совпадать с данными, внесёнными организаторами.
      </p>

      <button class="button primary full" type="submit">
        ВОЙТИ ▶
      </button>

      <p class="form-message" id="register-message" aria-live="polite"></p>
    </form>
  </section>
</main>

<footer>KLIPTOK · БУДЬ В ТРЕНДЕ!</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
