
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный кабинет — 12 ёлочных игрушек до Нового года</title>
  <link rel="icon" type="image/png" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">АВАТАРСКИЙ KLIPTOK<span>★</span></a>
  <nav>
    <a href="index.html">Главная</a>
    <a href="rules.html">Правила</a>
    <a href="tree.html">Моя ёлка</a>
  </nav>
</header>

<main class="page">
  <section class="panel cabinet">
    <div class="eyebrow">PLAYER PROFILE</div>
    <h1>ЛИЧНЫЙ КАБИНЕТ</h1>

    <div class="player-chip">
      <span>ТВОЙ ID из TGC</span>
      <strong id="player-id">—</strong>
      <button class="button small" id="change-id">Изменить</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span>★</span>
        <small>ВЫПОЛНЕНО</small>
        <b id="cabinet-completed">0/12</b>
      </div>
      <div class="stat-card">
        <span>✉</span>
        <small>НА ПРОВЕРКЕ</small>
        <b id="cabinet-review">0</b>
      </div>
    </div>

    <div class="progress-panel">
      <div class="progress-top">
        <span>МОЙ ПРОГРЕСС</span>
        <b id="cabinet-percent">0%</b>
      </div>
      <div class="progress-track">
        <div id="cabinet-progress-fill" class="progress-fill"></div>
      </div>
      <p id="cabinet-progress-message">Приключение только начинается!</p>
    </div>

    <div class="cabinet-actions">
      <a class="button primary" href="tree.html">МОЯ ЁЛКА ★</a>
      <a class="button" href="rules.html">ПРАВИЛА</a>
      <a class="button" href="index.html">НА ГЛАВНУЮ</a>
    </div>
  </section>
</main>
<footer>KLIPTOK · БУДЬ В ТРЕНДЕ!</footer>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
